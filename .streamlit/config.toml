[browser]
gatherUsageStats = false

[server]
# headless = true avoids Streamlit's first-run e-mail prompt; the launchers open the browser.
headless = true
maxUploadSize = 50

[theme]
base = "light"
primaryColor = "#2a78d6"

[client]
# Hide Streamlit's developer menu and "Deploy" button: the user only sees the application.
toolbarMode = "viewer"
